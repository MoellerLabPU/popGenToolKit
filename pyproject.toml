[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AlleleFlux"
version = "0.1.4"
description = "AlleleFlux: A tool for fine grained evolutionary analysis of microbial populations and communities"
authors = [
    {name = "Siddhartha Uppal", email = "sidd.uppal96@gmail.com"},
    {name = "Andrew Moeller", email = "andrew.moeller@princeton.edu"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "tqdm",
    "intervaltree",
    "pysam",
    "biopython",
    "snakemake>=8.0.0",
    "snakemake-executor-plugin-cluster-generic",
    "rpy2",
    "click",
    "questionary",
    "pyyaml",
]

[project.optional-dependencies]
# Test dependencies — installed via `pip install -e ".[test]"`.
# Kept out of `dependencies` and environment.yml so production / end-user
# installs don't pull pytest in.  CI workflows + local test runs use this.
test = [
    "pytest",
    "pytest-cov",
]
# Dev convenience extra: bundles test plus any future linters/formatters.
dev = [
    "AlleleFlux[test]",
]

[project.scripts]
alleleflux = "alleleflux.cli:main"

# Analysis scripts
alleleflux-profile = "alleleflux.scripts.analysis.profile_mags:main"
alleleflux-allele-freq = "alleleflux.scripts.analysis.allele_frequency.allele_freq:main"
alleleflux-cache-allele-freq = "alleleflux.scripts.analysis.allele_frequency.allele_freq_cache:main"
alleleflux-scores = "alleleflux.scripts.analysis.scoring.scores:main"
alleleflux-taxa-scores = "alleleflux.scripts.analysis.scoring.taxa_scores:main"
alleleflux-gene-scores = "alleleflux.scripts.analysis.scoring.gene_scores:main"
alleleflux-outliers = "alleleflux.scripts.analysis.scoring.outliers_genes:main"
alleleflux-cmh-scores = "alleleflux.scripts.analysis.scoring.cmh_scores:main"
alleleflux-regional-contrast = "alleleflux.scripts.analysis.regional_contrast:main"
alleleflux-regional-contrast-summary = "alleleflux.scripts.preprocessing.regional_contrast_summary:main"
alleleflux-pairwise-ani = "alleleflux.scripts.analysis.ani.pairwise_ani:main"
alleleflux-strain-turnover = "alleleflux.scripts.analysis.ani.strain_turnover:main"
alleleflux-replacement-classification = "alleleflux.scripts.analysis.ani.replacement_classification:main"

# Preprocessing scripts
alleleflux-metadata = "alleleflux.scripts.preprocessing.mag_metadata:main"
alleleflux-qc = "alleleflux.scripts.preprocessing.quality_control:main"
alleleflux-eligibility = "alleleflux.scripts.preprocessing.eligibility_table:main"
alleleflux-permute-metadata = "alleleflux.scripts.preprocessing.permute_metadata:main"
alleleflux-preprocess-between-groups = "alleleflux.scripts.preprocessing.preprocess_between_groups:main"
alleleflux-preprocess-within-group = "alleleflux.scripts.preprocessing.preprocess_within_group:main"
alleleflux-preprocessing-eligibility = "alleleflux.scripts.preprocessing.preprocessing_eligibility:main"

# Summary scripts (roll up results produced after the statistics step)
alleleflux-p-value-summary = "alleleflux.scripts.summary.p_value_summary:main"
alleleflux-significant-sites-summary = "alleleflux.scripts.summary.significant_sites_summary:main"

# Statistics scripts
alleleflux-lmm = "alleleflux.scripts.statistics.LMM:main"
alleleflux-single-sample = "alleleflux.scripts.statistics.single_sample:main"
alleleflux-two-sample-paired = "alleleflux.scripts.statistics.two_sample_paired:main"
alleleflux-two-sample-unpaired = "alleleflux.scripts.statistics.two_sample_unpaired:main"
alleleflux-cmh = "alleleflux.scripts.statistics.CMH:main"

# Evolution
alleleflux-dnds-from-timepoints = "alleleflux.scripts.evolution.dnds_from_timepoints:main"

# Accessory scripts
alleleflux-create-mag-mapping = "alleleflux.scripts.accessory.create_mag_mapping:main"
alleleflux-add-bam-path = "alleleflux.scripts.accessory.add_bam_path_to_metadata:main"
alleleflux-coverage-allele-stats = "alleleflux.scripts.accessory.coverage_and_allele_stats:main"
alleleflux-list-mags = "alleleflux.scripts.accessory.list_mags:main"
alleleflux-positions-qc = "alleleflux.scripts.accessory.positions_qc:main"
alleleflux-copy-profiles = "alleleflux.scripts.accessory.copy_mag_profiles:main"

# Visualization scripts
alleleflux-prepare-metadata = "alleleflux.scripts.visualization.accessory.prepare_metadata:main"
alleleflux-terminal-nucleotide = "alleleflux.scripts.visualization.accessory.terminal_nucleotide_analysis:main"
alleleflux-track-alleles = "alleleflux.scripts.visualization.accessory.track_allele_frequencies:main"
alleleflux-plot-trajectories = "alleleflux.scripts.visualization.plot_allele_trajectory:main"

# Prevent setuptools from auto-including files from MANIFEST.in or VCS
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["alleleflux*"]
namespaces = false

[tool.setuptools.package-data]
# Include only static workflow files required at runtime.
# Explicit patterns prevent accidental inclusion of .snakemake/, logs/, or data outputs.
alleleflux = [
    "smk_workflow/*.smk",           # Snakemake workflow files
    "smk_workflow/**/*.smk",        # Nested workflow rules
    "smk_workflow/**/Snakefile",    # Main Snakefile
    "smk_workflow/*.yml",           # Config templates
    "smk_workflow/*.yaml",          # Config templates (alt extension)
    "smk_workflow/**/*.yml",        # Nested configs
    "smk_workflow/**/*.yaml",       # Nested configs (alt extension)
    "smk_workflow/**/*.R",          # R scripts used by workflow
    "smk_workflow/slurm_profile/*", # Slurm profile configuration
]

[project.urls]
"Homepage" = "https://github.com/MoellerLabPU/AlleleFlux"
"Bug Tracker" = "https://github.com/MoellerLabPU/AlleleFlux/issues"

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
markers = [
    "regression: end-to-end regression test (slow; runs the full pipeline)",
] 
